name: Build ECR for Windows and Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # New React app lives in react-shell/
  REACT_DIR: react-shell
  VERSION: 1.0.${{ github.run_number }}

jobs:
  # --------------------------------------------------
  # 1. Build the new Vite React app
  # --------------------------------------------------
  build-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-shell/package-lock.json

      - name: Install & build React app
        working-directory: ${{ env.REACT_DIR }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Upload built React app
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: react-shell/dist
          if-no-files-found: error

  # --------------------------------------------------
  # 2. Fast online update (publish the built HTML + assets)
  # --------------------------------------------------
  publish-html:
    needs: build-react
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: dist

      - name: Prepare update package
        run: |
          # Create a single zip that contains index.html + assets
          # so the Electron app can download and extract it later
          cd dist
          zip -r ../ecr-app.zip .
          cd ..
          ls -lh ecr-app.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: GNHS ECR v${{ env.VERSION }}
          files: ecr-app.zip
          generate_release_notes: true

  # --------------------------------------------------
  # 3. Build Windows & Mac Electron installers
  # --------------------------------------------------
  build:
    needs: build-react
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: react-dist

      - name: Package the app (Electron + React dist)
        shell: bash
        run: |
          mkdir -p ecr/www ecr/build

          # Copy the entire Vite build into the Electron www folder
          cp -r react-dist/* ecr/www/

          # App icons
          for ICON in icon.icns icon.ico icon.png; do
            if [ -f "build/$ICON" ]; then
              cp "build/$ICON" "ecr/build/$ICON"
            elif [ -f "$ICON" ]; then
              cp "$ICON" "ecr/build/$ICON"
            fi
          done
          ls -la ecr/build

          # package.json for electron-builder
          cat > ecr/package.json <<EOF
          {
            "name": "gnhs-ecr",
            "version": "${{ env.VERSION }}",
            "description": "GNHS Electronic Class Record",
            "author": "GNHS",
            "main": "main.js",
            "build": {
              "appId": "com.gnhs.ecr",
              "productName": "GNHS ECR",
              "directories": { "buildResources": "build" },
              "files": ["main.js", "www/**/*"],
              "win": {
                "icon": "build/icon.ico",
                "target": ["nsis", "portable"]
              },
              "nsis": {
                "oneClick": true,
                "perMachine": false,
                "artifactName": "GNHS-ECR-Setup.exe"
              },
              "portable": {
                "artifactName": "GNHS-ECR-Portable.exe"
              },
              "mac": {
                "icon": "build/icon.icns",
                "target": ["dir"],
                "category": "public.app-category.education",
                "identity": null
              }
            }
          }
          EOF

          # Simple Electron main process (loads the React app)
          cat > ecr/main.js <<'EOF'
          const { app, BrowserWindow, Menu } = require('electron');
          const path = require('path');

          let win = null;

          function createWindow() {
            win = new BrowserWindow({
              show: false,
              width: 1280,
              height: 800,
              autoHideMenuBar: true,
              title: 'GNHS ECR',
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false
              }
            });

            // Load the Vite-built React app
            win.loadFile(path.join(__dirname, 'www', 'index.html'));

            win.once('ready-to-show', () => {
              win.maximize();
              win.show();
            });
          }

          function buildMenu() {
            const isMac = process.platform === 'darwin';
            const template = [
              ...(isMac ? [{ role: 'appMenu' }] : []),
              { role: 'editMenu' },
              ...(isMac ? [{ role: 'windowMenu' }] : []),
              {
                label: 'Help',
                submenu: [
                  { label: 'GNHS ECR v' + app.getVersion(), enabled: false }
                ]
              }
            ];
            Menu.setApplicationMenu(Menu.buildFromTemplate(template));
          }

          app.whenReady().then(() => {
            buildMenu();
            createWindow();
          });

          app.on('window-all-closed', () => app.quit());
          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });
          EOF

          cd ecr
          npm install --save-dev electron@31 electron-builder@24

          if [ "${{ matrix.name }}" = "Windows" ]; then
            npx electron-builder --win --publish never
          else
            npx electron-builder --mac --x64 --arm64 --publish never

            # Ad-hoc sign + create DMG (same as before)
            for APP in dist/mac/*.app dist/mac-arm64/*.app; do
              [ -d "$APP" ] || continue
              case "$APP" in
                dist/mac-arm64/*) ARCH=arm64 ;;
                *) ARCH=x64 ;;
              esac
              codesign --force --deep -s - "$APP"
              mkdir -p "out-$ARCH"
              cp -R "$APP" "out-$ARCH/"
              ln -s /Applications "out-$ARCH/Applications"
              hdiutil create -volname "GNHS ECR" -srcfolder "out-$ARCH" -ov -format UDZO "dist/GNHS-ECR-Mac-$ARCH.dmg"
            done
          fi

      - name: List what was built
        shell: bash
        run: ls -la ecr/dist

      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-ECR-${{ matrix.name }}
          path: |
            ecr/dist/GNHS-ECR-Setup.exe
            ecr/dist/GNHS-ECR-Portable.exe
            ecr/dist/GNHS-ECR-Mac-*.dmg
          if-no-files-found: error

  # --------------------------------------------------
  # 4. Attach installers to the same GitHub Release
  # --------------------------------------------------
  release:
    needs: [build, publish-html]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: ls -R artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: GNHS ECR v${{ env.VERSION }}
          files: |
            artifacts/GNHS-ECR-Windows/GNHS-ECR-Setup.exe
            artifacts/GNHS-ECR-Windows/GNHS-ECR-Portable.exe
            artifacts/GNHS-ECR-Mac/GNHS-ECR-Mac-*.dmg
