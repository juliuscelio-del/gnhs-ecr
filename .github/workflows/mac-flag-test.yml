name: Mac flag test

on:
  workflow_dispatch:

env:
  HTML_FILE: ElectronicClassRecordFINAL.html

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [bare-signed, html-signed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build and ad-hoc sign (${{ matrix.variant }})
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p t/www
          if [ "$VARIANT" = "bare-signed" ]; then
            printf '<!doctype html><meta charset="utf-8"><title>test</title><h1>hello</h1>\n' > t/www/index.html
          else
            cp "$HTML_FILE" t/www/index.html
          fi

          cat > t/main.js <<'EOF'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          app.whenReady().then(() => {
            const w = new BrowserWindow({ width: 1280, height: 800 });
            w.loadFile(path.join(__dirname, 'www', 'index.html'));
          });
          app.on('window-all-closed', () => app.quit());
          EOF

          cat > t/package.json <<EOF
          {
            "name": "gnhs-ecr-test-$VARIANT",
            "version": "1.0.0",
            "description": "ECR flag test ($VARIANT)",
            "author": "GNHS",
            "main": "main.js",
            "build": {
              "appId": "com.gnhs.ecrtest.$VARIANT",
              "productName": "ECR Test $VARIANT",
              "files": ["main.js", "www/**/*"],
              "mac": { "target": ["dir"], "identity": null }
            }
          }
          EOF

          cd t
          npm install --save-dev electron@31 electron-builder@24
          npx electron-builder --mac --arm64 --publish never
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP"
          codesign --force --deep -s - "$APP"
          codesign -dv "$APP" || true
          mkdir -p out
          cp -R "$APP" out/
          ln -s /Applications out/Applications
          hdiutil create -volname "ECR Test" -srcfolder out -ov -format UDZO "ECR-Test-$VARIANT.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ECR-Test-${{ matrix.variant }}
          path: t/ECR-Test-*.dmg
          if-no-files-found: error
